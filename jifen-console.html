<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>积分台 · 加分/扣分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   积分台 · Claude Code 暖米风
   单主题（暖米浅色），固定渲染，作为前端实现的视觉基准。
   ============================================================ */
:root{
  /* 颜色 token */
  --bg:#F4F1EA;          /* 页面底色：暖米 */
  --surface:#FCFBF7;     /* 卡片/输入面 */
  --surface-2:#F1EDE3;   /* 头图/次级面 */
  --text:#2A2723;        /* 主文字：暖近黑 */
  --muted:#7C756A;       /* 次要文字 */
  --faint:#9A9284;       /* 弱化文字 */
  --line:#DFDACD;        /* 边框 */
  --accent:#D97757;      /* 主色：赤陶橙 */
  --accent-deep:#B5562F; /* 主色深（激活/强调） */
  --plus:#4A9D6A;        /* 加分语义绿 */
  --plus-ink:#3C8255;    /* 加分文字 */
  --minus:#C25B4E;       /* 扣分语义红 */
  --minus-ink:#A94A3E;   /* 扣分文字 */

  /* 字体 token */
  --serif:"Noto Serif SC",STSong,"Songti SC",serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,monospace;

  /* 尺寸 token */
  --radius:6px;
  --radius-lg:8px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.page{ max-width:1000px; margin:0 auto; padding:0 20px 64px; }

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 0; border-bottom:1px solid var(--line); margin-bottom:28px;
}
.brand{ font-family:var(--serif); font-weight:900; font-size:22px; letter-spacing:.01em; }
.brand .dot{ color:var(--accent); }
.topbar .status{ font-family:var(--mono); font-size:12px; color:var(--muted); }
.topbar .status .cursor{ color:var(--accent); }

/* ---------- 双栏布局 ---------- */
.layout{ display:grid; grid-template-columns:1.1fr .9fr; gap:24px; align-items:start; }
@media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

.panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:22px;
}
.panel-head{ margin-bottom:18px; }
.panel-title{ font-family:var(--serif); font-size:17px; font-weight:700; margin:0 0 4px; }
.panel-sub{ font-size:12px; color:var(--muted); margin:0; }

/* ---------- 表单 ---------- */
.op-form{ display:flex; flex-direction:column; gap:16px; }
.field-label{
  font-family:var(--mono); font-size:11px; font-weight:400;
  letter-spacing:.04em; color:var(--muted); margin-bottom:8px;
}
.field-label .prompt{ color:var(--accent); }

.f-person{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:10px 12px;
}
.avatar{
  width:38px; height:38px; border-radius:var(--radius); flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:#fff; font-size:16px; font-weight:700;
}
.f-person .who b{ display:block; font-size:14px; font-weight:700; line-height:1.2; color:var(--text); }
.f-person .who small{ font-size:12px; color:var(--faint); }
.f-person .caret{ margin-left:auto; font-size:12px; color:var(--faint); }

.f-seg{ display:flex; gap:8px; }
.f-seg .opt{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 12px; border-radius:var(--radius); border:1px solid var(--line);
  font-family:var(--mono); font-size:13px; font-weight:700; cursor:pointer;
  background:var(--surface); color:var(--muted);
}
.f-seg .opt.plus.active{ background:#EDF4EE; border-color:var(--plus); color:var(--plus-ink); }
.f-seg .opt.minus.active{ background:#F4E7E4; border-color:var(--minus); color:var(--minus-ink); }

.f-points{ display:flex; align-items:center; gap:14px; }
.f-points .num{
  font-family:var(--mono); font-size:36px; font-weight:700; line-height:1;
  color:var(--plus); font-variant-numeric:tabular-nums;
}
.f-points .unit{ font-size:15px; color:var(--faint); }
.f-stepper{ display:flex; gap:8px; margin-left:auto; }
.f-stepper button{
  width:36px; height:36px; border-radius:var(--radius); border:1px solid var(--line);
  font-family:var(--mono); font-size:16px; cursor:pointer;
  background:var(--surface); color:var(--muted); line-height:1;
}

.f-reason textarea{
  width:100%; border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 12px; background:var(--surface); color:var(--text);
  font-family:var(--sans); font-size:13px; line-height:1.6; resize:none; min-height:64px;
}
.f-reason textarea::placeholder{ color:var(--faint); }

.f-balance{ display:flex; align-items:baseline; gap:8px; font-size:13px; color:var(--muted); }
.f-balance .b-new{
  font-family:var(--mono); font-size:20px; font-weight:700;
  color:var(--plus-ink); font-variant-numeric:tabular-nums;
}

.f-submit{
  width:100%; padding:13px; border:none; border-radius:var(--radius);
  background:var(--accent); color:#fff; font-family:var(--mono);
  font-size:14px; font-weight:700; cursor:pointer;
}
.f-submit:active{ background:var(--accent-deep); }

/* ---------- 飞书卡片 ---------- */
.fk-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden;
}
.fk-head{
  display:flex; align-items:center; gap:10px; padding:13px 15px;
  background:var(--surface-2); border-bottom:1px solid var(--line);
}
.fk-head .bot{
  width:30px; height:30px; border-radius:var(--radius); flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:#fff; font-size:14px; font-weight:700;
}
.fk-head .fk-title{ font-family:var(--serif); font-size:14px; font-weight:700; color:var(--text); }
.fk-head .tag{
  margin-left:auto; font-family:var(--mono); font-size:10px;
  padding:2px 7px; border-radius:999px; background:#E7E1D3; color:var(--muted);
}
.fk-body{ padding:14px 15px; }
.fk-amount{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.fk-amount .big{
  font-family:var(--mono); font-size:26px; font-weight:700; line-height:1;
  color:var(--plus-ink); font-variant-numeric:tabular-nums;
}
.fk-amount .who{ font-size:14px; font-weight:700; color:var(--text); }
.fk-reason{ font-size:13px; color:var(--muted); margin:0 0 6px; }
.fk-divider{ height:1px; background:var(--line); margin:11px 0; }
.fk-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; }
.fk-row .r-label{ color:var(--muted); }
.fk-row .r-val{
  font-family:var(--mono); font-size:15px; font-weight:700;
  color:var(--accent-deep); font-variant-numeric:tabular-nums;
}
.fk-meta{ font-size:11px; color:var(--faint); margin-top:10px; }
.fk-foot{ display:flex; gap:10px; padding:12px 15px; border-top:1px solid var(--line); }
.fk-foot button{
  flex:1; padding:9px; border-radius:var(--radius); font-size:13px; font-weight:700; cursor:pointer;
}
.fk-foot .ghost{
  background:transparent; border:1px solid var(--line); color:var(--muted); font-family:var(--mono);
}
.fk-foot .primary{
  border:none; background:var(--accent); color:#fff; font-family:var(--mono);
}

/* ---------- 页脚 ---------- */
.foot{
  margin-top:32px; padding-top:16px; border-top:1px solid var(--line);
  font-size:12px; color:var(--faint);
}
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="brand">积分台<span class="dot">.</span></div>
    <span class="status"><span class="cursor">▌</span> 加分 / 扣分</span>
  </header>

  <main class="layout">

    <!-- 操作台 -->
    <section class="panel">
      <div class="panel-head">
        <h1 class="panel-title">记一笔</h1>
        <p class="panel-sub">选定人员并录入分值，确认后发送飞书卡片</p>
      </div>

      <div class="op-form">
        <div>
          <div class="field-label"><span class="prompt">&gt;</span> 选择人员</div>
          <div class="f-person">
            <span class="avatar">张</span>
            <div class="who"><b>张三</b><small>研发部</small></div>
            <span class="caret">▾</span>
          </div>
        </div>

        <div>
          <div class="field-label"><span class="prompt">&gt;</span> 操作类型</div>
          <div class="f-seg">
            <button class="opt plus active">＋ 加分</button>
            <button class="opt minus">－ 扣分</button>
          </div>
        </div>

        <div>
          <div class="field-label"><span class="prompt">&gt;</span> 分值</div>
          <div class="f-points">
            <span class="num">+5</span>
            <span class="unit">分</span>
            <div class="f-stepper"><button>−</button><button>＋</button></div>
          </div>
        </div>

        <div>
          <div class="field-label"><span class="prompt">&gt;</span> 原因</div>
          <div class="f-reason">
            <textarea placeholder="填写加 / 扣分原因（可选）">提前完成「Q3 结算」项目里程碑</textarea>
          </div>
        </div>

        <div class="f-balance">当前积分 <b>115</b> → <b class="b-new">120 分</b></div>

        <button class="f-submit">确认并发送飞书卡片</button>
      </div>
    </section>

    <!-- 飞书卡片预览 -->
    <aside class="panel">
      <div class="panel-head">
        <h1 class="panel-title">飞书卡片预览</h1>
        <p class="panel-sub">发送后对方将收到以下卡片</p>
      </div>

      <div class="fk-card">
        <div class="fk-head">
          <span class="bot">积</span>
          <span class="fk-title">积分变更通知</span>
          <span class="tag">积分助手</span>
        </div>
        <div class="fk-body">
          <div class="fk-amount"><span class="big">+5 分</span><span class="who">张三 · 加分</span></div>
          <p class="fk-reason">原因：提前完成「Q3 结算」项目里程碑</p>
          <div class="fk-divider"></div>
          <div class="fk-row"><span class="r-label">当前积分</span><span class="r-val">120 分</span></div>
          <div class="fk-meta">操作人：王经理 · 今天 14:32</div>
        </div>
        <div class="fk-foot">
          <button class="ghost">查看明细</button>
          <button class="primary">知道了</button>
        </div>
      </div>
    </aside>

  </main>

  <footer class="foot">静态参考 · 未接入业务逻辑</footer>

</div>
</body>
</html>
