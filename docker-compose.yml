name: orvibo-jifen

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service-defaults
    image: orvibo-jifen-backend:local
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      DEMO_MODE: "false"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 30s
  worker:
    <<: *service-defaults
    image: orvibo-jifen-backend:local
    pull_policy: never
    env_file: .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      DEMO_MODE: "false"
    command: ["python", "-m", "app.worker"]
    mem_limit: 768m
    stop_grace_period: 40s
    depends_on:
      api:
        condition: service_healthy
  frontend:
    <<: *service-defaults
    image: orvibo-jifen-frontend:local
    build: ./frontend
    mem_limit: 128m
    # 现有域名网关通过服务器网卡回源 8888，不能只绑定环回地址。
    ports: ["0.0.0.0:8888:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
